name: Supabase keep-alive

on:
  schedule:
    - cron: "0 0 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::저장소 Secrets에 SUPABASE_URL, SUPABASE_ANON_KEY를 등록하세요."; exit 1
          fi
          BASE="${URL%/}"; BASE="${BASE%/rest/v1}"
          CODE=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            "$BASE/rest/v1/drug_cache?select=key&limit=1" -H "apikey: $KEY")
          echo "HTTP $CODE"; cat /tmp/out.txt; echo
          [ "$CODE" = "200" ] || { echo "::error::Supabase 응답 이상 (HTTP $CODE)"; exit 1; }
