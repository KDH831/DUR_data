# Supabase 무료 프로젝트는 일주일 동안 요청이 없으면 일시 정지됨 → 3일마다 한 번 가볍게 조회
# 필요한 GitHub 저장소 Secrets: SUPABASE_URL, SUPABASE_ANON_KEY (Settings → Secrets and variables → Actions)
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 0 */3 * *"     # 3일마다 09:00 (한국 시간)
  workflow_dispatch:           # Actions 탭에서 'Run workflow'로 수동 실행 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::저장소 Secrets에 SUPABASE_URL, SUPABASE_ANON_KEY를 등록하세요."; exit 1
          fi
          BASE="${URL%/}"; BASE="${BASE%/rest/v1}"
          CODE=$(curl -s -o /tmp/out.txt -w "%{http_code}" \
            "$BASE/rest/v1/drug_cache?select=key&limit=1" -H "apikey: $KEY")
          echo "HTTP $CODE"; cat /tmp/out.txt; echo
          [ "$CODE" = "200" ] || { echo "::error::Supabase 응답 이상 (HTTP $CODE)"; exit 1; }
